<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1340" viewBox="0 0 1500 1340" role="img" aria-labelledby="title description">
  <title id="title">Crime Vault model connections</title>
  <desc id="description">A visual map of direct and polymorphic Eloquent model relationships in Crime Vault.</desc>
  <defs>
    <marker id="arrowDirect" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#287c79"/>
    </marker>
    <marker id="arrowPoly" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b3663b"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", sans-serif; fill: #202b30; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #56656a; }
      .column { font-size: 14px; font-weight: 700; letter-spacing: 1px; fill: #637277; }
      .model { font-size: 20px; font-weight: 700; }
      .detail { font-size: 14px; fill: #56656a; }
      .relation { font-size: 16px; font-weight: 600; }
      .small { font-size: 13px; fill: #56656a; }
      .row { fill: #ffffff; stroke: #d9e0df; stroke-width: 1.5; }
      .source { fill: #e9f2f1; stroke: #a8c9c5; stroke-width: 1.5; }
      .target { fill: #f2f0e8; stroke: #d2c9ad; stroke-width: 1.5; }
      .direct { fill: none; stroke: #287c79; stroke-width: 3; marker-end: url(#arrowDirect); }
      .poly { fill: none; stroke: #b3663b; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrowPoly); }
    </style>
  </defs>

  <rect width="1500" height="1340" fill="#f5f7f5"/>
  <text x="70" y="75" class="title">Crime Vault model connections</text>
  <text x="70" y="108" class="subtitle">Each row shows the source model, Eloquent relation, and related model.</text>

  <line x1="1030" y1="74" x2="1080" y2="74" stroke="#287c79" stroke-width="3"/>
  <text x="1092" y="80" class="small">Direct relationship</text>
  <line x1="1260" y1="74" x2="1310" y2="74" stroke="#b3663b" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="1322" y="80" class="small">Polymorphic</text>

  <text x="95" y="162" class="column">SOURCE MODEL</text>
  <text x="645" y="162" class="column">RELATIONSHIP METHODS</text>
  <text x="1115" y="162" class="column">RELATED MODEL</text>

  <rect x="70" y="180" width="1360" height="145" rx="8" class="row"/>
  <rect x="95" y="205" width="360" height="95" rx="6" class="source"/>
  <text x="120" y="242" class="model">SerialKiller</text>
  <text x="120" y="270" class="detail">one victim record</text>
  <path d="M455 252 H1040" class="direct"/>
  <text x="625" y="231" class="relation">hasOne: victimRecord()</text>
  <text x="625" y="275" class="detail">Foreign key: victims.killer_id</text>
  <rect x="1065" y="205" width="335" height="95" rx="6" class="target"/>
  <text x="1090" y="242" class="model">Victim</text>
  <text x="1090" y="270" class="detail">inverse: belongsTo killer()</text>

  <rect x="70" y="340" width="1360" height="145" rx="8" class="row"/>
  <rect x="95" y="365" width="360" height="95" rx="6" class="source"/>
  <text x="120" y="402" class="model">User</text>
  <text x="120" y="430" class="detail">one user owns many records</text>
  <path d="M455 412 H1040" class="direct"/>
  <text x="625" y="391" class="relation">hasMany: favourites()</text>
  <text x="625" y="435" class="detail">inverse: belongsTo user()</text>
  <rect x="1065" y="365" width="335" height="95" rx="6" class="target"/>
  <text x="1090" y="402" class="model">Favourite</text>
  <text x="1090" y="430" class="detail">also has favouritable()</text>

  <rect x="70" y="500" width="1360" height="145" rx="8" class="row"/>
  <rect x="95" y="525" width="360" height="95" rx="6" class="source"/>
  <text x="120" y="562" class="model">User</text>
  <text x="120" y="590" class="detail">one user writes many records</text>
  <path d="M455 572 H1040" class="direct"/>
  <text x="625" y="551" class="relation">hasMany: discussions()</text>
  <text x="625" y="595" class="detail">inverse: belongsTo user()</text>
  <rect x="1065" y="525" width="335" height="95" rx="6" class="target"/>
  <text x="1090" y="562" class="model">Discussion</text>
  <text x="1090" y="590" class="detail">also has discussable()</text>

  <rect x="70" y="660" width="1360" height="155" rx="8" class="row"/>
  <rect x="95" y="680" width="205" height="52" rx="6" class="source"/>
  <text x="112" y="713" class="model" style="font-size:17px">SerialKiller</text>
  <text x="319" y="714" class="small" style="font-weight:700">OR</text>
  <rect x="350" y="680" width="205" height="52" rx="6" class="source"/>
  <text x="367" y="713" class="model" style="font-size:17px">UnsolvedCase</text>
  <path d="M555 706 H1040" class="poly"/>
  <text x="645" y="692" class="relation">morphMany: favourites()</text>
  <text x="645" y="744" class="detail">Favourite::favouritable() is morphTo</text>
  <rect x="1065" y="690" width="335" height="95" rx="6" class="target"/>
  <text x="1090" y="727" class="model">Favourite</text>
  <text x="1090" y="755" class="detail">polymorphic case owner</text>
  <text x="95" y="779" class="small">Either case model may be the owner.</text>

  <rect x="70" y="830" width="1360" height="155" rx="8" class="row"/>
  <rect x="95" y="850" width="205" height="52" rx="6" class="source"/>
  <text x="112" y="883" class="model" style="font-size:17px">SerialKiller</text>
  <text x="319" y="884" class="small" style="font-weight:700">OR</text>
  <rect x="350" y="850" width="205" height="52" rx="6" class="source"/>
  <text x="367" y="883" class="model" style="font-size:17px">UnsolvedCase</text>
  <path d="M555 876 H1040" class="poly"/>
  <text x="645" y="862" class="relation">morphMany: discussions()</text>
  <text x="645" y="914" class="detail">Discussion::discussable() is morphTo</text>
  <rect x="1065" y="860" width="335" height="95" rx="6" class="target"/>
  <text x="1090" y="897" class="model">Discussion</text>
  <text x="1090" y="925" class="detail">polymorphic case owner</text>
  <text x="95" y="949" class="small">Either case model may be the owner.</text>

  <rect x="70" y="1000" width="1360" height="155" rx="8" class="row"/>
  <rect x="95" y="1020" width="205" height="52" rx="6" class="source"/>
  <text x="112" y="1053" class="model" style="font-size:17px">SerialKiller</text>
  <text x="319" y="1054" class="small" style="font-weight:700">OR</text>
  <rect x="350" y="1020" width="205" height="52" rx="6" class="source"/>
  <text x="367" y="1053" class="model" style="font-size:17px">UnsolvedCase</text>
  <path d="M555 1046 H1040" class="poly"/>
  <text x="645" y="1032" class="relation">morphMany: events()</text>
  <text x="645" y="1084" class="detail">CaseEvent::eventable() is morphTo</text>
  <rect x="1065" y="1030" width="335" height="95" rx="6" class="target"/>
  <text x="1090" y="1067" class="model">CaseEvent</text>
  <text x="1090" y="1095" class="detail">polymorphic case owner</text>
  <text x="95" y="1119" class="small">Either case model may be the owner.</text>

  <rect x="70" y="1180" width="1360" height="105" rx="8" fill="#eef0ed" stroke="#d9e0df" stroke-width="1.5"/>
  <text x="100" y="1223" class="model" style="font-size:18px">Resource</text>
  <text x="250" y="1223" class="detail">No Eloquent relationships are declared on this model.</text>
  <text x="100" y="1255" class="small">Polymorphic *id / *type columns identify a model and its record; they are not regular foreign keys.</text>
</svg>